name: sporand_native
description: >-
  Native bridges of the SpoRand mobile app (internal code name): the input
  clock (InputClockApi) and the scheduled clip player (ClipPlayerApi). Code is
  generated by Pigeon from apps/mobile/pigeons/; see README.md.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.13.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.brandtbd.sporand_native
        pluginClass: SporandNativePlugin
      ios:
        pluginClass: SporandNativePlugin
