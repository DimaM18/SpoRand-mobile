name: sporand_native
description: >-
  Native bridges of the SpoRand mobile app (internal code name): the
  scheduled clip player (ClipPlayerApi) and the music-app hand-off
  (MusicAppApi). The input clock lives in mobile_kit_clock. Code is generated
  by Pigeon from pigeons/ (repository root); see README.md.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.13.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  # analysis_options.yaml includes package:flutter_lints/flutter.yaml.
  flutter_lints: 6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.brandtbd.sporand_native
        pluginClass: SporandNativePlugin
      ios:
        pluginClass: SporandNativePlugin
