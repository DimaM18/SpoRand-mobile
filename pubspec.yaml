name: sporand
description: "Party music game (internal code name SpoRand; public brand TBD, see brief Q3)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI. Flutter 3.47 ships Material as the decoupled `material_ui` package
  # (go_router 18 detects MaterialApp from it), so the app uses it throughout.
  material_ui: ^1.5.0
  cupertino_ui: ^1.1.1
  cupertino_icons: ^1.0.8

  # State, DI, navigation.
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

  # SDKs (each wrapped behind an interface in lib/core, with a fake).
  firebase_core: ^4.15.0
  firebase_analytics: ^12.6.0
  firebase_remote_config: ^6.7.0
  firebase_crashlytics: ^5.4.0
  firebase_app_check: ^0.4.8
  google_mobile_ads: ^9.1.0
  purchases_flutter: ^10.13.2
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  connectivity_plus: ^7.3.1
  share_plus: ^13.3.0

  # Native bridges (Pigeon: InputClockApi, ClipPlayerApi); see pigeons/.
  sporand_native:
    path: packages/sporand_native

  # Pure Dart helpers.
  clock: ^1.1.3
  http: ^1.6.0
  intl: any
  pub_semver: ^2.2.1
  qr: ^4.0.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  # Generates the native bridges from pigeons/*.dart.
  pigeon: ^29.0.4

flutter:
  uses-material-design: true
  # ARB files live in lib/core/l10n/arb (see l10n.yaml).
  generate: true
